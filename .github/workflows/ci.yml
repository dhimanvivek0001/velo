name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint (same pre-commit hooks as local)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure

  test:
    name: API tests (fixture model, no Databricks)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - run: pytest -m "not integration" -v

  dbt-parse:
    name: dbt parse (compile models and tests, no connection)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install dbt-core==1.12.5 dbt-databricks==1.12.7
      - name: Dummy dbt profile (parse never connects to Databricks)
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<'EOF'
          velo:
            target: ci
            outputs:
              ci:
                type: databricks
                catalog: velo
                schema: gold
                host: example.cloud.databricks.com
                http_path: /sql/1.0/warehouses/ci
                token: placeholder-not-a-secret
          EOF
      - name: dbt deps + parse
        working-directory: dbt/velo
        run: |
          dbt deps
          dbt parse
