version: 2

models:
  - name: dim_zone
    description: "One row per TLC taxi zone, with borough and flags for Manhattan core and airports."
    columns:
      - name: zone_id
        description: "TLC zone ID (1-265)"
        data_tests: [unique, not_null]

  - name: dim_date
    description: "One row per day, Jul 2024 - Jun 2025, with weekend, US holiday and congestion-pricing flags."
    columns:
      - name: date_day
        description: "Calendar date"
        data_tests: [unique, not_null]

  - name: fct_zone_hour
    description: "One row per pickup zone per hour (Jul 2024 - Jun 2025), aggregated from ~240M HVFHV trips. Grain: zone_id + hour_ts."
    data_tests:
      # Grain, using dbt_utils instead of a hand-written test
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [zone_id, hour_ts]
      # Logic: a subset can never exceed the total
      - dbt_utils.expression_is_true:
          arguments:
            expression: "trips_with_cbd_fee <= trips"
      # Completeness: every trip should belong to Uber or Lyft (the only HVFHV companies now)
      - dbt_utils.expression_is_true:
          arguments:
            expression: "trips = trips_uber + trips_lyft"
          config:
            severity: warn
    columns:
      - name: zone_id
        description: "TLC pickup zone ID (FK to dim_zone)"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_zone')
                field: zone_id
      - name: hour_ts
        description: "Start of the hour, local NYC clock time"
        data_tests: [not_null]
      - name: trips
        description: "Number of completed trips picked up in this zone-hour"
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: median_wait_min
        description: "Median minutes from request to pickup (bad and outlier waits excluded)"
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 60
      - name: p90_wait_min
        description: "90th-percentile wait: the experience of the unluckiest 10% of riders"
      - name: share_wait_over_10min
        description: "Share of riders who waited over 10 minutes (leakage risk signal)"
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: gross_bookings_usd
        description: "Sum of base passenger fares, USD"
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
              config:
                severity: warn  # fare adjustments can be negative, so this is suspicious, not impossible
      - name: avg_trip_miles
        description: "Average trip distance in miles"
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
              config:
                severity: warn
      - name: temp_c
        description: "Hourly temperature in NYC, Celsius"
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -30
                max_value: 45
      - name: trips_with_cbd_fee
        description: "Trips charged the Manhattan congestion pricing fee (from 5 Jan 2025)"
      - name: borough
        description: "Borough of the pickup zone"
        data_tests: [not_null]
      - name: borough_active_events
        description: "Non-sports permitted events active in the same borough this hour"
